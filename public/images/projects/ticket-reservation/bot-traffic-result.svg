<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bot traffic test result graph</title>
  <desc id="desc">QA direct API baseline graph comparing ticket reservation bot traffic contention and distributed scenarios.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#page-bg)"/>
  <rect x="32" y="32" width="896" height="476" rx="8" fill="#ffffff" filter="url(#soft-shadow)"/>
  <rect x="32" y="32" width="896" height="476" rx="8" fill="none" stroke="#cbd5e1"/>

  <text x="70" y="78" fill="#0f172a" font-family="Pretendard, Arial, sans-serif" font-size="30" font-weight="700">봇 트래픽 테스트 결과</text>
  <text x="70" y="108" fill="#475569" font-family="Pretendard, Arial, sans-serif" font-size="16">QA direct-api baseline · 2026-05-04 · ticket-reservation-testbot</text>

  <g font-family="Pretendard, Arial, sans-serif">
    <rect x="70" y="134" width="390" height="296" rx="8" fill="#f8fafc" stroke="#d7dee8"/>
    <text x="92" y="170" fill="#0f172a" font-size="20" font-weight="700">동일 좌석 경합</text>
    <text x="92" y="195" fill="#64748b" font-size="13">한 좌석에 동시 요청. 성공 1건, 나머지는 좌석 선점 실패로 처리.</text>

    <line x1="110" y1="386" x2="420" y2="386" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="110" y1="226" x2="110" y2="386" stroke="#94a3b8" stroke-width="1.4"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="110" y1="332" x2="420" y2="332"/>
      <line x1="110" y1="279" x2="420" y2="279"/>
      <line x1="110" y1="226" x2="420" y2="226"/>
    </g>
    <g fill="#94a3b8" font-size="11" text-anchor="end">
      <text x="102" y="390">0</text>
      <text x="102" y="335">100</text>
      <text x="102" y="282">200</text>
      <text x="102" y="229">300</text>
    </g>
    <text x="114" y="216" fill="#64748b" font-size="11">requests</text>

    <g>
      <rect x="132" y="381" width="40" height="5" rx="3" fill="#ef4444"/>
      <rect x="132" y="378" width="40" height="3" rx="2" fill="#16a34a"/>
      <rect x="204" y="360" width="40" height="26" rx="4" fill="#ef4444"/>
      <rect x="204" y="357" width="40" height="3" rx="2" fill="#16a34a"/>
      <rect x="276" y="333" width="40" height="53" rx="4" fill="#ef4444"/>
      <rect x="276" y="330" width="40" height="3" rx="2" fill="#16a34a"/>
      <rect x="348" y="226" width="40" height="160" rx="4" fill="#ef4444"/>
      <rect x="348" y="223" width="40" height="3" rx="2" fill="#16a34a"/>
    </g>

    <polyline points="152,372 224,347 296,338 368,236" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#2563eb">
      <circle cx="152" cy="372" r="4"/>
      <circle cx="224" cy="347" r="4"/>
      <circle cx="296" cy="338" r="4"/>
      <circle cx="368" cy="236" r="4"/>
    </g>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="152" y="408">10</text>
      <text x="224" y="408">50</text>
      <text x="296" y="408">100</text>
      <text x="368" y="408">300</text>
    </g>
    <g fill="#475569" font-size="11" text-anchor="middle">
      <text x="152" y="371">p95 258ms</text>
      <text x="224" y="340">731ms</text>
      <text x="296" y="331">899ms</text>
      <text x="368" y="229">2820ms</text>
    </g>
  </g>

  <g font-family="Pretendard, Arial, sans-serif">
    <rect x="500" y="134" width="390" height="296" rx="8" fill="#f8fafc" stroke="#d7dee8"/>
    <text x="522" y="170" fill="#0f172a" font-size="20" font-weight="700">분산 좌석 예매</text>
    <text x="522" y="195" fill="#64748b" font-size="13">여러 좌석으로 분산 요청. 좌석 수 한계와 결제 지연이 함께 드러남.</text>

    <line x1="540" y1="386" x2="850" y2="386" stroke="#94a3b8" stroke-width="1.4"/>
    <line x1="540" y1="226" x2="540" y2="386" stroke="#94a3b8" stroke-width="1.4"/>
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="540" y1="346" x2="850" y2="346"/>
      <line x1="540" y1="306" x2="850" y2="306"/>
      <line x1="540" y1="266" x2="850" y2="266"/>
      <line x1="540" y1="226" x2="850" y2="226"/>
    </g>
    <g fill="#94a3b8" font-size="11" text-anchor="end">
      <text x="532" y="390">0%</text>
      <text x="532" y="349">25</text>
      <text x="532" y="309">50</text>
      <text x="532" y="269">75</text>
      <text x="532" y="229">100</text>
    </g>
    <text x="544" y="216" fill="#64748b" font-size="11">success ratio + p95</text>

    <g>
      <rect x="562" y="226" width="40" height="160" rx="4" fill="#16a34a"/>
      <rect x="634" y="236" width="40" height="150" rx="4" fill="#16a34a"/>
      <rect x="634" y="226" width="40" height="10" rx="3" fill="#ef4444"/>
      <rect x="706" y="261" width="40" height="125" rx="4" fill="#16a34a"/>
      <rect x="706" y="226" width="40" height="35" rx="4" fill="#ef4444"/>
      <rect x="778" y="328" width="40" height="58" rx="4" fill="#16a34a"/>
      <rect x="778" y="226" width="40" height="102" rx="4" fill="#ef4444"/>
    </g>

    <polyline points="582,362 654,306 726,254 798,234" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#f59e0b">
      <circle cx="582" cy="362" r="4"/>
      <circle cx="654" cy="306" r="4"/>
      <circle cx="726" cy="254" r="4"/>
      <circle cx="798" cy="234" r="4"/>
    </g>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="582" y="408">10</text>
      <text x="654" y="408">50</text>
      <text x="726" y="408">100</text>
      <text x="798" y="408">300</text>
    </g>
    <g fill="#475569" font-size="11" text-anchor="middle">
      <text x="582" y="220">10 / 0</text>
      <text x="654" y="220">47 / 3</text>
      <text x="726" y="220">78 / 22</text>
      <text x="798" y="220">109 / 191</text>
      <text x="582" y="357">p95 664ms</text>
      <text x="654" y="301">2242ms</text>
      <text x="726" y="249">3696ms</text>
      <text x="798" y="229">4285ms</text>
    </g>
  </g>

  <g font-family="Pretendard, Arial, sans-serif" font-size="12" fill="#475569">
    <rect x="70" y="448" width="188" height="34" rx="8" fill="#f8fafc" stroke="#d7dee8"/>
    <rect x="88" y="461" width="10" height="10" rx="2" fill="#16a34a"/>
    <text x="106" y="470">Success</text>
    <rect x="163" y="461" width="10" height="10" rx="2" fill="#ef4444"/>
    <text x="181" y="470">Fail / conflict</text>

    <rect x="276" y="448" width="204" height="34" rx="8" fill="#f8fafc" stroke="#d7dee8"/>
    <line x1="294" y1="465" x2="322" y2="465" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <text x="332" y="470">Contention total p95</text>

    <rect x="498" y="448" width="190" height="34" rx="8" fill="#f8fafc" stroke="#d7dee8"/>
    <line x1="516" y1="465" x2="544" y2="465" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <text x="554" y="470">Distributed total p95</text>

    <rect x="706" y="448" width="184" height="34" rx="8" fill="#0f172a"/>
    <text x="798" y="470" fill="#ffffff" text-anchor="middle" font-weight="700">300 users · p95 4285ms</text>
  </g>
</svg>
