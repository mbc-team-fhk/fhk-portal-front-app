apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fhk-portal-front-app-ingress
  namespace: staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.qa.fhk-team.org
        - qa.fhk-team.org
      secretName: fhk-team-org-tls
  rules:
    - host: www.qa.fhk-team.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fhk-portal-front-app
                port:
                  number: 80
    - host: qa.fhk-team.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fhk-portal-front-app
                port:
                  number: 80
